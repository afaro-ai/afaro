<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Afaro" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Afaro</title>
  <defs>
    <mask id="cut">
      <rect width="640" height="200" fill="#fff"/>
      <!-- the piece taken away: a clean bite out of the ring, upper right -->
      <circle cx="146" cy="58" r="30" fill="#000"/>
    </mask>
  </defs>

  <!-- MARK: a ring with one segment removed. aphairein, to take away. -->
  <g transform="translate(40,20)">
    <circle cx="80" cy="80" r="62" fill="none" stroke="#1F2A37" stroke-width="22" mask="url(#cut)"/>
    <!-- the removed piece, set apart and fading -->
    <circle cx="146" cy="14" r="11" fill="#2F7D6F"/>
  </g>

  <!-- WORDMARK -->
  <text x="220" y="128" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="108" font-weight="600" letter-spacing="-3" fill="#1F2A37">afaro</text>
</svg>
